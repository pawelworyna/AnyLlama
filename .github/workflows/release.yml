name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            uv run python scripts/release_version.py check --tag $env:REF_NAME
          } else {
            uv run python scripts/release_version.py check
          }
      - run: uv run python scripts/build.py
      - name: Verify frozen app in runner session
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python scripts/verify_exe.py --skip-credential-store --skip-tray | Tee-Object -FilePath "dist/$env:APP_VERSION/validation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv run python scripts/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          if gh api --include "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-response.txt"; then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$tag_sha" != "$SOURCE_SHA" ]; then
              echo 'The existing tag points to another commit.' >&2
              exit 1
            fi
          elif ! grep -Eq '^HTTP/[0-9.]+ 404' "$RUNNER_TEMP/tag-response.txt"; then
            echo 'Cannot verify the target tag.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Published versions are not overwritten.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "AnyLlama $RELEASE_TAG" --generate-notes --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
