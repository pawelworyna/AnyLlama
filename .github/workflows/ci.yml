name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/release_version.py check
      - run: uv run ruff check src scripts tests
      - run: node --check src/anyllama/static/app.js
      - run: uv run pytest -q
      - run: uv run python -m playwright install chromium
      - run: uv run python scripts/verify_ui.py --browser chromium
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
